<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1.0">
  <script type="module" src="/dist/main.js"></script>
  <html-include src="/_includes/head.html"></html-include>
  <title>Dropdown – Components Reference – Live Wires</title>
</head>
<body class="scheme-default scheme-default">
  <html-include src="/_includes/header.html"></html-include>
  <main id="main">
    <article class="section prose">
      <h1>Dropdown</h1>
<!-- Basic dropdown -->
<div class="dropdown">
  <button class="button trigger">Menu</button>
  <ul class="menu">
    <li><a href="#">Action 1</a></li>
    <li><a href="#">Action 2</a></li>
    <li><hr></li>
    <li><button>Delete</button></li>
  </ul>
</div>

<!-- End-aligned dropdown -->
<div class="dropdown dropdown--end">
  <button class="button trigger">Options</button>
  <ul class="menu">
    <li><a href="#">Edit</a></li>
    <li><a href="#">Duplicate</a></li>
  </ul>
</div>

<!-- Upward dropdown -->
<div class="dropdown dropdown--up">
  <button class="button trigger">Actions</button>
  <ul class="menu">
    <li><a href="#">View</a></li>
    <li><a href="#">Export</a></li>
  </ul>
</div>

<!-- Panel dropdown: checkbox filter (native details/summary, no JS) -->
<details class="dropdown dropdown--panel">
  <summary class="trigger button button--small">
    <span>Circles</span>
    <span class="text-muted ml-025">All</span>
    <svg class="icon dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
  </summary>
  <div class="menu">
    <div id="circle-options" class="dropdown-body stack stack-compact px-05 py-025" role="group" aria-label="Filter by circle">
      <label class="checkbox">
        <input type="checkbox" name="circle" value="design">
        <span>Design</span>
        <span class="text-muted">12<span class="visually-hidden"> members</span></span>
      </label>
      <label class="checkbox">
        <input type="checkbox" name="circle" value="engineering">
        <span>Engineering</span>
        <span class="text-muted">8<span class="visually-hidden"> members</span></span>
      </label>
      <label class="checkbox">
        <input type="checkbox" name="circle" value="operations">
        <span>Operations</span>
        <span class="text-muted">3<span class="visually-hidden"> members</span></span>
      </label>
    </div>
    <footer class="cluster pt-025 pb-0">
      <button type="button" class="button button--small">Clear all</button>
    </footer>
  </div>
</details>

<!-- With disabled item -->
<div class="dropdown">
  <button class="button trigger">More</button>
  <ul class="menu">
    <li><a href="#">Available</a></li>
    <li><a href="#" disabled>Unavailable</a></li>
  </ul>
</div>
    </article>
  </main>
  <html-include src="/_includes/footer.html"></html-include>
</body>
</html>
