<body class="scheme-default">

    <article class="section prose">
      <h1>Date filter</h1>
<!-- Date range fields -->
<div class="date-range">
  <input type="date" name="a-from" value="2027-01-08" aria-label="Start date">
  <span aria-hidden="true">–</span>
  <input type="date" name="a-to" value="2027-01-14" aria-label="End date">
</div>

<!-- Small fields -->
<div class="date-range date-range--small">
  <input type="date" name="b-from" value="2027-01-08" aria-label="Start date">
  <span aria-hidden="true">–</span>
  <input type="date" name="b-to" value="2027-01-14" aria-label="End date">
</div>

<!-- Presets, stacked -->
<div class="presets" role="group" aria-label="Preset ranges">
  <label class="radio"><input type="radio" name="p1" value="today"><span>Today</span></label>
  <label class="radio"><input type="radio" name="p1" value="yesterday"><span>Yesterday</span></label>
  <label class="radio"><input type="radio" name="p1" value="week"><span>This week</span></label>
  <label class="radio"><input type="radio" name="p1" value="7d" checked><span>Last week</span></label>
  <label class="radio"><input type="radio" name="p1" value="month"><span>This month</span></label>
  <label class="radio"><input type="radio" name="p1" value="30d"><span>Last month</span></label>
  <label class="radio"><input type="radio" name="p1" value="year"><span>This year</span></label>
  <label class="radio"><input type="radio" name="p1" value="12m"><span>Last 12 months</span></label>
  <label class="radio"><input type="radio" name="p1" value="fy"><span>This fiscal year</span></label>
  <label class="radio"><input type="radio" name="p1" value="all"><span>All time</span></label>
</div>

<!-- Presets, inline -->
<div class="presets presets--inline" role="group" aria-label="Preset ranges">
  <label class="radio"><input type="radio" name="p2" value="7d" checked><span>Last week</span></label>
  <label class="radio"><input type="radio" name="p2" value="30d"><span>Last month</span></label>
  <label class="radio"><input type="radio" name="p2" value="12m"><span>Last year</span></label>
</div>

<!-- Presets only -->

    <div class="body">
