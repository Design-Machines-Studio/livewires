<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading lifecycle checks – Live Wires</title>
  <script type="module" src="/dist/main.js"></script>
  <html-include src="/_includes/head.html"></html-include>
</head>
<body class="scheme-default">
  <html-include src="/_includes/header.html"></html-include>
  <main class="section prose" id="main">
    <h1>Loading lifecycle checks</h1>
    <p>These checks exercise local state and real DOM updates. Datastar notifications use a synthetic host mapping. No server or durable save is involved.</p>
    <button id="run" type="button">Run checks</button>
    <ol id="results" aria-live="polite"></ol>
    <div id="fixtures"></div>
  </main>
  <script type="module">
    import { createLoadingOperation, attachDatastarLoading } from '/dist/loading.js';
    const run = document.querySelector('#run');
    const results = document.querySelector('#results');
    const fixtures = document.querySelector('#fixtures');
    const tick = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    run.addEventListener('click', async () => {
      run.disabled = true;
      results.replaceChildren();
      const owners = [];
      let passed = 0;
      const check = (ok, name) => {
        if (!ok) throw new Error(name);
        const li = document.createElement('li');
        li.textContent = `PASS — ${name}`;
        results.append(li);
        passed += 1;
      };
      const make = (durations = {}) => {
        const root = document.createElement('section');
        root.innerHTML = `<button type="button">Send</button><input aria-label="Unrelated input"><div data-content><div class="loading" data-indicator hidden><div class="skeleton skeleton--text"></div></div></div><p data-status role="status" aria-live="polite" aria-atomic="true"></p>`;
        fixtures.append(root);
        const operation = createLoadingOperation({ root, content: '[data-content]', indicator: '[data-indicator]', status: '[data-status]', delay: 0, minDuration: 0, ...durations });
        owners.push(() => operation.dispose());
        return { root, operation, content: () => root.querySelector('[data-content]'), indicator: () => root.querySelector('[data-indicator]'), status: () => root.querySelector('[data-status]') };
      };
      try {
        const a = make();
        const b = make();
        const first = a.operation.begin();
        const second = a.operation.begin();
        check(a.content().getAttribute('aria-busy') === 'true' && !b.operation.state.busy, 'requests mark only their explicit region busy');
        const input = a.root.querySelector('input');
        input.focus();
        input.value = 'Still usable';
        check(!input.disabled && document.activeElement === input, 'unrelated input remains usable and keeps focus');
        a.root.querySelector('button').remove();
        await tick();
        check(a.operation.state.pending === 2, 'removing the initiating control preserves overlapping requests');
        a.content().replaceWith(a.content().cloneNode(true));
        a.status().replaceWith(a.status().cloneNode(true));
        await tick();
        check(a.operation.state.pending === 2 && a.content().getAttribute('aria-busy') === 'true' && !a.indicator().hidden, 'replacement content and status rebind without acknowledging requests');
        check(!a.content().contains(a.status()) && a.indicator().getAttribute('aria-hidden') === 'true', 'announcements stay outside busy content and skeleton is decorative');
        first.finish('failed');
        check(a.operation.state.busy, 'one failed request cannot clear an overlapping request');
        second.finish();
        check(!a.operation.state.busy && a.operation.state.phase === 'failed' && /failed/.test(a.status().textContent), 'batch failure remains visible after a later completion');
        const aborted = new AbortController();
        a.operation.begin({ signal: aborted.signal });
        aborted.abort();
        check(a.operation.state.phase === 'cancelled' && !a.operation.state.busy, 'abort clears busy even without a transport result');
        const timed = make({ delay: 50, minDuration: 100 });
        const quick = timed.operation.begin();
        quick.finish();
        await wait(70);
        check(timed.indicator().hidden, 'quick completion never shows a skeleton');
        const slow = timed.operation.begin();
        await wait(70);
        check(!timed.indicator().hidden && getComputedStyle(timed.indicator()).display !== 'none', 'delayed skeleton is visible in the real DOM');
        slow.finish();
        check(!timed.indicator().hidden && timed.content().getAttribute('aria-busy') === 'false', 'minimum display tail keeps visuals without keeping content busy');
        await wait(110);
        check(timed.indicator().hidden && getComputedStyle(timed.indicator()).display === 'none', 'finished tail is hidden by loading CSS');
        check(timed.operation.state.phase === 'unknown' && !/saved/i.test(timed.status().textContent), 'request completion does not claim a successful save');
        const skeleton = timed.root.querySelector('.skeleton');
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const forced = matchMedia('(forced-colors: active)').matches;
        check(getComputedStyle(skeleton).animationName === ((reduced || forced) ? 'none' : 'shimmer'), `skeleton respects active motion/color preferences (reduced=${reduced}, forced=${forced})`);
        if (forced) check(getComputedStyle(skeleton).borderTopStyle === 'solid', 'forced-color skeleton has a visible outline');
        const target = new EventTarget();
        const disconnect = attachDatastarLoading(a.operation, { target, selectRequest: (e) => e.detail.scope === 'editor' ? e.detail : null });
        owners.push(disconnect);
        const send = (detail) => target.dispatchEvent(new CustomEvent('datastar-fetch', { detail }));
        send({ scope: 'dashboard', id: 'other', phase: 'started' });
        send({ scope: 'editor', id: 'stream', phase: 'started', background: true });
        check(!a.operation.state.busy, 'unrelated requests and a long-lived stream are ignored');
        send({ scope: 'editor', id: 'finite', phase: 'started' });
        send({ scope: 'editor', id: 'finite', phase: 'retrying' });
        check(a.operation.state.pending === 1, 'retries do not settle a finite request');
        disconnect();
        check(!a.operation.state.busy, 'adapter cleanup settles its remaining tokens');
        const late = b.operation.begin();
        b.root.remove();
        await tick();
        check(b.operation.state.phase === 'disposed' && late.finish() === false, 'root removal disposes state and ignores late completion');
        const removedStatus = make();
        removedStatus.operation.begin();
        removedStatus.content().replaceWith(removedStatus.content().cloneNode(true));
        removedStatus.status().remove();
        await tick();
        check(removedStatus.operation.state.phase === 'disposed' && removedStatus.content().getAttribute('aria-busy') === null && removedStatus.indicator().hidden, 'replacement busy targets are cleared when the status target disappears');
        document.querySelector('#results').dataset.result = 'pass';
      } catch (error) {
        const li = document.createElement('li');
        li.textContent = `FAIL — ${error.message}`;
        results.append(li);
        results.dataset.result = 'fail';
      } finally {
        owners.reverse().forEach((dispose) => dispose());
        fixtures.replaceChildren();
        results.dataset.passed = String(passed);
        run.disabled = false;
      }
    });
  </script>
</body>
</html>
